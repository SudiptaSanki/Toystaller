<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toystaller - Facebook Video Player</title>
  <link rel="icon" type="image/png" href="/Toystaller_logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c0f;
      color: #e4e6eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(18, 19, 23, 0.88);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: 4px;
    }
    .brand-badge {
      background: #1877f2;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #1877f2;
      color: #fff;
      box-shadow: 0 2px 8px rgba(24, 119, 242, 0.35);
    }
    .btn-primary:hover {
      background: #166fe5;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e4e6eb;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .player-container {
      margin-top: 56px;
      padding: 16px;
      width: 100%;
      max-width: 95vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .video-wrapper {
      position: relative;
      width: 90vw;
      max-width: 1280px;
      height: 75vh;
      max-height: 760px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.85);
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 12px;
      background: #000;
      outline: none;
    }
    .player-loader {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 12, 15, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.3s ease;
    }
    .loader-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #1877f2;
      border-radius: 50%;
      animation: toystaller-spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes toystaller-spin {
      to { transform: rotate(360deg); }
    }
    .loader-title {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 6px;
    }
    .loader-sub {
      font-size: 12px;
      color: #8a8d91;
      max-width: 320px;
      text-align: center;
    }
    .info {
      margin-top: 14px;
      font-size: 12px;
      color: #8a8d91;
      display: flex;
      align-items: center;
      gap: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="/Toystaller_logo.png" alt="logo" class="brand-logo">
      <span>Toystaller</span>
      <span class="brand-badge">Facebook Edition</span>
    </div>
    <div class="actions">
      <button id="copyBtn" class="btn btn-secondary" title="Copy video link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy Link
      </button>
      <button id="dlAudioBtn" class="btn btn-secondary" title="Download audio only" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        Download Audio
      </button>
      <button id="dlBtn" class="btn btn-primary" title="Download video">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download Video
      </button>
    </div>
  </div>

  <div class="player-container">
    <div class="video-wrapper">
      <div id="playerLoader" class="player-loader">
        <div class="loader-spinner"></div>
        <div id="loaderTitle" class="loader-title">Loading Highest Quality Stream...</div>
        <div id="loaderSubText" class="loader-sub">Optimizing master audio and video for your display</div>
        <button id="retryBtn" class="btn btn-secondary" style="display:none; margin-top: 14px;">Reload Stream</button>
      </div>
      <video id="videoPlayer" controls autoplay playsinline preload="auto"></video>
    </div>
    <audio id="audioPlayer" style="display:none;" preload="auto"></audio>
    <div class="info">
      <span id="resolutionText">HD MP4 Stream</span>
      <span>•</span>
      <span id="formatText">Direct Master Audio + Video</span>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
