<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toystaller - WhatsApp Media Viewer</title>
  <link rel="icon" type="image/png" href="Toystaller_logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b141a;
      color: #e9edef;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: rgba(17, 27, 33, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
    }
    .brand-badge {
      background: #25D366;
      color: #111b21;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #25D366;
      color: #111b21;
      box-shadow: 0 2px 10px rgba(37, 211, 102, 0.35);
    }
    .btn-primary:hover {
      background: #1ebe5d;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.45);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e9edef;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .player-container {
      margin-top: 58px;
      padding: 20px;
      max-width: 95vw;
      max-height: calc(100vh - 85px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    video {
      max-width: 90vw;
      max-height: 78vh;
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
      background: #000;
      outline: none;
    }
    img.media-view {
      max-width: 90vw;
      max-height: 78vh;
      border-radius: 12px;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.9);
      object-fit: contain;
      background: #000;
    }
    .info {
      margin-top: 14px;
      font-size: 12px;
      color: #8696a0;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .info span {
      display: inline-flex;
      align-items: center;
    }
    kbd {
      background: rgba(255, 255, 255, 0.1);
      color: #d1d7db;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      margin: 0 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="Toystaller_logo.png" alt="logo" class="brand-logo" onerror="this.src='icon.png'">
      <span>Toystaller</span>
      <span class="brand-badge">WhatsApp Edition</span>
    </div>
    <div class="actions">
      <button id="copyBtn" class="btn btn-secondary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy Link
      </button>
      <button id="dlBtn" class="btn btn-primary">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download
      </button>
    </div>
  </div>

  <div class="player-container">
    <video id="videoPlayer" controls autoplay playsinline style="display:none;"></video>
    <img id="imageViewer" class="media-view" style="display:none;" alt="WhatsApp Photo">
    <div class="info">
      <span id="resolutionText">Master Media</span>
      <span>•</span>
      <span id="formatText">High-Resolution Quality</span>
      <span id="shortcutsText">• Shortcuts: <kbd>Space</kbd> Play/Pause <kbd>M</kbd> Mute <kbd>F</kbd> Fullscreen</span>
    </div>
  </div>

  <script src="player.js"></script>
</body>
</html>
