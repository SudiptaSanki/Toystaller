<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toystaller - Media Player</title>
  <link rel="icon" type="image/png" href="Toystaller_logo.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0c0f;
      color: #e4e6eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      user-select: none;
    }
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: rgba(18, 19, 23, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .brand-logo {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      object-fit: cover;
    }
    .brand-badge {
      background: #4facfe;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: background 0.2s ease;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn-primary {
      background: #1877f2;
      color: #fff;
      box-shadow: 0 2px 8px rgba(24, 119, 242, 0.35);
    }
    .btn-primary:hover {
      background: #166fe5;
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e4e6eb;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
    }
    .player-container {
      margin-top: 56px;
      padding: 20px;
      max-width: 95vw;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    video {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
      background: #000;
      outline: none;
    }
    img.media-view {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.85);
      object-fit: contain;
      background: #000;
    }
    .info {
      margin-top: 14px;
      font-size: 12px;
      color: #8a8d91;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }
    kbd {
      background: rgba(255, 255, 255, 0.1);
      color: #d1d7db;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="Toystaller_logo.png" alt="logo" class="brand-logo">
      <span>Toystaller</span>
      <span id="brandBadge" class="brand-badge">Global Player</span>
    </div>
    <div class="actions">
      <button id="copyBtn" class="btn btn-secondary" title="Copy video link">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        Copy Link
      </button>
      <button id="copyMutedBtn" class="btn btn-secondary" title="Copy muted video link (no sound)" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        Copy Muted
      </button>
      <button id="copyAudioBtn" class="btn btn-secondary" title="Copy audio link" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        Copy Audio
      </button>
      <button id="dlMutedBtn" class="btn btn-secondary" title="Download video only without audio (muted)" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
        Download Muted
      </button>
      <button id="dlAudioBtn" class="btn btn-secondary" title="Download audio only" style="display:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        Download Audio
      </button>
      <button id="dlBtn" class="btn btn-primary" title="Download master video with audio">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Download Video
      </button>
    </div>
  </div>

  <div class="player-container">
    <video id="videoPlayer" controls controlsList="nodownload" autoplay playsinline preload="auto"></video>
    <audio id="audioPlayer" style="display:none;" preload="auto"></audio>
    <img id="imageViewer" class="media-view" style="display:none;" alt="Toystaller Media">
    <div class="info">
      <span id="resolutionText">HD Stream</span>
      <span>•</span>
      <span id="formatText">Direct Master Audio + Video</span>
      <span id="shortcutsText">• Shortcuts: <kbd>Space</kbd> Play/Pause <kbd>M</kbd> Mute <kbd>F</kbd> Fullscreen</span>
    </div>
  </div>

  <script src="hls.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
